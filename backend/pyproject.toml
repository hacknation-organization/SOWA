[project]
name = "kompas-kompetencji-backend"
version = "0.1.0"
description = "Backend aplikacji Kompas kompetencji (HackNation 2026, MC BDG)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "google-genai>=1.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
